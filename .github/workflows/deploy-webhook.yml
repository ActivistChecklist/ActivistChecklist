name: Deploy

on:
  push:
    branches:
      - main

# DEPLOY_SECRET and HEALTHCHECKS_DEPLOY_PING_URL live in the main-only environment, so
# only a run on main can read them. See .github/ACTIONS-SECRETS.md.
#
# The webhook answers 202 as soon as the build has started and does not wait for it:
# May First's proxy returns 504 after about 5 minutes, and some deploys take longer.
# So a green run here means the server accepted the deploy, not that it finished.
# The server's scripts/build-deploy.sh reports the result to the same Healthchecks
# check (DEPLOY_HEALTHCHECK_PING_URL on the server); its output is in the deploy log
# on the server and in the check's last ping.
#
# Optional: HEALTHCHECKS_DEPLOY_PING_URL is that check's Ping URL. This workflow only
# uses it to POST .../fail when the server did not accept the deploy, with the step
# output (truncated to 100 kB).

# This workflow only calls an external webhook; it needs nothing from GITHUB_TOKEN.
permissions: {}

jobs:
  trigger_build_and_deploy_webhook:
    environment: main-only
    runs-on: ubuntu-latest
    steps:
      - name: Trigger server deploy webhook
        id: deploy
        env:
          DEPLOY_URL: https://activistchecklist.org/webhooks/deploy.php
          DEPLOY_SECRET: ${{ secrets.DEPLOY_SECRET }}
          REPO_FULL_NAME: ${{ github.repository }}
          REF: ${{ github.ref }}
        run: |
          set -eo pipefail
          node - <<'NODE' 2>&1 | tee deploy-log.txt
          const crypto = require('crypto');
          const fs = require('fs');
          const os = require('os');
          const path = require('path');
          const { spawnSync } = require('child_process');

          const url = process.env.DEPLOY_URL;
          const secret = process.env.DEPLOY_SECRET;
          if (!secret) {
            console.error('Missing DEPLOY_SECRET');
            process.exit(1);
          }

          const payloadObj = {
            ref: process.env.REF,
            repository: { full_name: process.env.REPO_FULL_NAME }
          };
          const payload = JSON.stringify(payloadObj);
          const ts = Math.floor(Date.now() / 1000);
          const signed = `${ts}\n${payload}`;
          const sig = 'sha256=' + crypto.createHmac('sha256', secret).update(signed).digest('hex');

          const bodyFile = path.join(os.tmpdir(), `deploy-webhook-body-${process.pid}.txt`);
          // Do not use curl -f: we need the response body on 4xx/5xx (deploy.php explains the failure).
          const res = spawnSync(
            'curl',
            [
              '-sS',
              '-o',
              bodyFile,
              '-w',
              '%{http_code}',
              '-X',
              'POST',
              url,
              '-H',
              'Content-Type: application/json',
              '-H',
              `X-Deploy-Timestamp: ${ts}`,
              '-H',
              `X-Hub-Signature-256: ${sig}`,
              '--data-binary',
              payload
            ],
            { encoding: 'utf8' }
          );

          if (res.error) {
            console.error(res.error.message);
            process.exit(1);
          }
          if (res.status !== 0) {
            console.error('curl failed:', res.stderr || '(no stderr)');
            process.exit(res.status ?? 1);
          }

          const httpCode = String(res.stdout || '').trim();
          let body = '';
          try {
            body = fs.readFileSync(bodyFile, 'utf8');
          } catch (e) {
            body = '(could not read response body)';
          }
          try {
            fs.unlinkSync(bodyFile);
          } catch (_) {
            // ignore
          }

          console.log('--- Webhook HTTP status:', httpCode, '---');
          console.log(body);
          // 202: build started. 200: nothing to build (ignored ref), or a deploy.php
          // older than the 202 change that ran the build to the end.
          if (httpCode === '202' || httpCode === '200') {
            process.exit(0);
          }
          // Rollout only. The server serves the deploy.php from its previous deploy, so the
          // first push after the 202 change still runs the old one, which waits for the
          // build and can hit the proxy's 504. That build keeps going and reports to
          // Healthchecks itself. Delete this branch once any run of this workflow has
          // logged a 202: from then on a 504 means the webhook hung before starting the
          // build, which is a real failure.
          if (httpCode === '504') {
            console.log(
              '::warning::The proxy timed out waiting for an older deploy.php. The build ' +
                'is still running on the server and reports its result to Healthchecks.'
            );
            process.exit(0);
          }
          console.error(
            '\nDeploy webhook did not return 202. The message above is from the server (if any).\n' +
              'On 403 Forbidden, compare GitHub secret DEPLOY_SECRET with server webhook-secrets (HMAC),\n' +
              'and allowed_repository with github.repository. Also check include/logs/deploy-webhook.error.log\n' +
              'and the PHP/Apache error log on the server.'
          );
          process.exit(1);
          NODE
          exit "${PIPESTATUS[0]}"

      # Only when the server did not take the deploy. When it did, the build pings
      # the check itself, start and finish, so a ping from here would race it.
      - name: Notify Healthchecks.io of a failed trigger
        if: failure()
        continue-on-error: true
        env:
          HEALTHCHECKS_DEPLOY_PING_URL: ${{ secrets.HEALTHCHECKS_DEPLOY_PING_URL }}
          JOB_STATUS: ${{ job.status }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{
            github.run_id }}
        run: |
          if [ -z "$HEALTHCHECKS_DEPLOY_PING_URL" ]; then
            echo 'Skipping Healthchecks: HEALTHCHECKS_DEPLOY_PING_URL secret is not set.'
            exit 0
          fi

          BASE="${HEALTHCHECKS_DEPLOY_PING_URL%/}"

          # Signal failure with logs (Healthchecks stores the first 100 kB of the body).
          (
            echo "job_status=${JOB_STATUS}"
            echo "run_url=${RUN_URL}"
            echo '--- deploy log ---'
            if [ -f deploy-log.txt ]; then
              cat deploy-log.txt
            else
              echo '(deploy-log.txt missing)'
            fi
          ) | head -c 100000 | curl -fsS -m 30 --retry 3 --data-binary @- "${BASE}/fail"

          echo 'Healthchecks: failure ping sent with log excerpt.'
