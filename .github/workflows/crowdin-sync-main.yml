# Hides untranslatable strings in Crowdin after each source push. See scripts/crowdin-hide-strings.mjs.
#
# AI pre-translation is left to Crowdin's own auto pre-translate (Project Settings > Pre-translate
# > AI), which runs when new content is imported. Edited strings count as new because crowdin.yml
# leaves update_option unset, so Crowdin clears their old translations. Calling the
# pre-translations API from here per touched file re-translated every non-approved string in that
# file, so unchanged strings churned on every push.
#
# Crowdin’s GitHub integration pulls source changes from the repo continuously (not only on the
# hourly sync schedule). See https://support.crowdin.com/github-integration/
# A short fixed sleep runs before Crowdin API steps; optional extra minutes on manual dispatch.
#
# The Crowdin token lives in the main-only environment (see .github/ACTIONS-SECRETS.md), so a
# manual run must be dispatched on main, and its head_sha must be a commit already on main.
# Otherwise anyone who can push a branch could run their own copy of the script with the token.

name: Crowdin sync (main)

on:
  push:
    branches: [main]
    # Keep in sync with `files[].source` in crowdin.yml
    paths:
      - 'content/en/**/*.mdx'
      - 'messages/en.json'

  workflow_dispatch:
    inputs:
      delay_minutes:
        description: 'Extra minutes after the fixed buffer (0 = buffer only)'
        default: '0'
        type: string
      head_sha:
        description: 'Optional commit SHA (default — branch HEAD)'
        required: false
        type: string

concurrency:
  group: crowdin-main-sync
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  crowdin:
    environment: main-only
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check head_sha is on main
        if: github.event.inputs.head_sha != ''
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.event.inputs.head_sha }}
        run: |
          if ! [[ "$HEAD_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "head_sha must be a full 40-character commit SHA."
            exit 1
          fi
          # "ahead" or "identical" means main contains HEAD_SHA.
          status=$(gh api "repos/${GITHUB_REPOSITORY}/compare/${HEAD_SHA}...main" --jq .status)
          if [ "$status" != 'ahead' ] && [ "$status" != 'identical' ]; then
            echo "head_sha is not on main (compare status: ${status})."
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.inputs.head_sha || github.sha }}

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc

      - name: Wait before Crowdin API steps
        env:
          EXTRA: ${{ github.event.inputs.delay_minutes }}
        run: |
          BUFFER_SEC=45
          echo "Fixed buffer: ${BUFFER_SEC}s before Crowdin steps (import may lag the push slightly)."
          sleep "$BUFFER_SEC"
          if [ -n "$EXTRA" ] && [ "$EXTRA" != "0" ]; then
            echo "Additional wait: ${EXTRA} minute(s)."
            sleep "${EXTRA}m"
          fi

      # Hides JSX attribute/frontmatter values (level=, slug=, type=, ...) so Crowdin can't
      # translate them, and clears any stray translations. Only affects strings sourced from
      # content/en/**/*.mdx — same English text in messages/en.json (e.g. riskLevel.everyoneLabel
      # vs level="everyone") is explicitly left visible and translatable.
      - name: Hide untranslatable strings
        if: true
        env:
          CROWDIN_PERSONAL_TOKEN: ${{ secrets.CROWDIN_PERSONAL_TOKEN }}
          CROWDIN_PROJECT_ID: ${{ secrets.CROWDIN_PROJECT_ID }}
        run: node scripts/crowdin-hide-strings.mjs --apply
