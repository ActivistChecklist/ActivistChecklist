# .github/dependabot.yml
version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "daily"
    cooldown:
      default-days: 2
      semver-major-days: 7
      semver-minor-days: 3
      semver-patch-days: 2
    groups:
      dependencies:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
    open-pull-requests-limit: 10

    # Bumps we have evaluated and declined live here. Every entry MUST have a
    # matching section in /DEPENDENCIES.md with the reason and the condition
    # that would let us accept it. Removing a rule means the hold is over.
    ignore:
      # DEPENDENCIES.md#typescript-7-blocker-lifted-not-yet-taken
      # The Next 15 blocker is GONE (we are on 16.3.3 now). This rule remains
      # only so the compiler swap does not land unreviewed. Verify with
      # `tsc --noEmit && pnpm buildstatic`, then delete this rule.
      - dependency-name: "typescript"
        update-types:
          - "version-update:semver-major"

      # DEPENDENCIES.md#js-yaml-5-blocked-by-keystaticcore-and-breaks-our-date-handling
      # @keystatic/core pins js-yaml ^4.1.0, and v5 drops the default export
      # and loads YAML dates as strings instead of Date objects.
      - dependency-name: "js-yaml"
        update-types:
          - "version-update:semver-major"

  # Optional: Also check for GitHub Actions updates
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    # Only default-days is supported for github-actions; the semver-*-days
    # keys are npm-only and make Dependabot reject the whole config.
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns:
          - "*"
