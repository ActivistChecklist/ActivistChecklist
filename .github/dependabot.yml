# .github/dependabot.yml
version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "daily"
    cooldown:
      default-days: 2
      semver-major-days: 7
      semver-minor-days: 3
      semver-patch-days: 2
    groups:
      dependencies:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
    open-pull-requests-limit: 10

    # Bumps we have evaluated and declined live here. Every entry MUST have a
    # matching section in /DEPENDENCIES.md with the reason and the condition
    # that would let us accept it. Removing a rule means the hold is over.
    #
    # Currently empty on purpose: as of 2026-08-28 every hold we had was
    # re-tested and cleared. Do not add a rule without a DEPENDENCIES.md entry.
    ignore: []

  # Optional: Also check for GitHub Actions updates
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    # Only default-days is supported for github-actions; the semver-*-days
    # keys are npm-only and make Dependabot reject the whole config.
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns:
          - "*"
