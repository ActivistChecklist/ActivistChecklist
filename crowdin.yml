# Crowdin CLI config: https://developer.crowdin.com/configuration-file/
# Set CROWDIN_PROJECT_ID and CROWDIN_PERSONAL_TOKEN in the environment (or a local .env).

project_id_env: CROWDIN_PROJECT_ID
api_token_env: CROWDIN_PERSONAL_TOKEN

# Source and translation paths are relative to the repo root.
base_path: '.'
preserve_hierarchy: true

# The GitHub integration appends "[ci skip]" to every commit it makes unless we
# replace its message. GitHub Actions honors that tag on the PR's head commit, so
# pull_request workflows never ran on l10n_* PRs and the required merge_gate check
# sat on "Expected" until someone pushed a commit by hand. Burst pushes are fine:
# pr-checks.yml and codeql.yml cancel superseded runs, and both skip heavy jobs on
# l10n_* branches.
commit_message: 'New translations %original_file_name% (%language%)'
append_commit_message: false

files:
  - source: /content/en/**/*.mdx
    translation: /content/%two_letters_code%/**/%original_file_name%
    type: mdx_v2
  - source: /messages/en.json
    translation: /messages/%two_letters_code%.json
